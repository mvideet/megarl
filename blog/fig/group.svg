<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-label="A question is answered four times; correct answers get reward 1 and a positive advantage, wrong ones a negative advantage." font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect x="0.5" y="18.5" width="236.0" height="200.0" rx="10" fill="#f6f8fb" stroke="#e4e8ef" stroke-width="1"/><text x="16.0" y="44.0" font-size="12" fill="#5b6475" text-anchor="start" font-weight="600">One question</text><text x="16.0" y="72.0" font-size="15" fill="#1d232f" text-anchor="start" font-weight="600">What is 251 + 345?</text><text x="24.0" y="100.0" font-size="14" fill="#1d232f" text-anchor="start" font-weight="400">A. 638</text><text x="24.0" y="122.0" font-size="14" fill="#1d232f" text-anchor="start" font-weight="400">B. 941</text><text x="24.0" y="144.0" font-size="14" fill="#2f9e44" text-anchor="start" font-weight="600">C. 596</text><text x="24.0" y="166.0" font-size="14" fill="#1d232f" text-anchor="start" font-weight="400">D. 586</text><text x="16.0" y="204.0" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">asked 4 times</text><text x="292.0" y="14.0" font-size="12" fill="#5b6475" text-anchor="start" font-weight="600">4 sampled answers</text><text x="588.0" y="14.0" font-size="12" fill="#5b6475" text-anchor="middle" font-weight="600">reward</text><text x="672.0" y="14.0" font-size="12" fill="#5b6475" text-anchor="middle" font-weight="600">advantage</text><path d="M238,118 C262,118 262,48 282,48" stroke="#8a93a3" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="286.0" y="30.0" width="270.0" height="36.0" rx="7" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/><text x="298.0" y="53.0" font-size="12.5" fill="#1d232f" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">...so the sum is 596. Answer: C</text><text x="588.0" y="54.0" font-size="16" fill="#2f9e44" text-anchor="middle" font-weight="700">1</text><text x="672.0" y="54.0" font-size="16" fill="#2f9e44" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+0.87</text><path d="M238,118 C262,118 262,96 282,96" stroke="#8a93a3" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="286.0" y="78.0" width="270.0" height="36.0" rx="7" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/><text x="298.0" y="101.0" font-size="12.5" fill="#1d232f" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">...about 586. Answer: D</text><text x="588.0" y="102.0" font-size="16" fill="#e03131" text-anchor="middle" font-weight="700">0</text><text x="672.0" y="102.0" font-size="16" fill="#e03131" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-0.87</text><path d="M238,118 C262,118 262,144 282,144" stroke="#8a93a3" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="286.0" y="126.0" width="270.0" height="36.0" rx="7" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/><text x="298.0" y="149.0" font-size="12.5" fill="#1d232f" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">251 + 345 = 596. Answer: C</text><text x="588.0" y="150.0" font-size="16" fill="#2f9e44" text-anchor="middle" font-weight="700">1</text><text x="672.0" y="150.0" font-size="16" fill="#2f9e44" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+0.87</text><path d="M238,118 C262,118 262,192 282,192" stroke="#8a93a3" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="286.0" y="174.0" width="270.0" height="36.0" rx="7" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/><text x="298.0" y="197.0" font-size="12.5" fill="#1d232f" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">...probably 638. Answer: A</text><text x="588.0" y="198.0" font-size="16" fill="#e03131" text-anchor="middle" font-weight="700">0</text><text x="672.0" y="198.0" font-size="16" fill="#e03131" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-0.87</text></svg>